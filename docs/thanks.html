<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Thank you — CopyCat</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="favicon.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<style>
  /* Post-purchase page — same light, purple-accented brand as the site. */
  :root {
    --ink: #121212;
    --ink-2: #5e5e5e;
    --ink-3: #8c8c8c;
    --line: #ececec;
    --line-2: #e2e2e2;
    --accent: #5e17eb;
    --accent-soft: #f3edff;
    --tint: #f4f0ff;
    --tint-deep: #ece5ff;
    --good: #12a150;
    --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: linear-gradient(180deg, var(--tint) 0%, #fff 55%);
    color: var(--ink);
    font-family: var(--font);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }

  /* confetti sits behind the card and never intercepts clicks */
  #confetti {
    position: fixed; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
  }

  .card {
    position: relative; z-index: 1;
    max-width: 540px; width: 100%; text-align: center;
    background: #fff; border: 1px solid var(--line);
    border-radius: 26px; padding: 46px 40px 40px;
    box-shadow: 0 30px 60px -34px rgba(18, 18, 18, 0.34);
  }

  /* the mascot art is cropped at the edges by design, so it reads correctly
     only inside a tile — same treatment as the app icon and the site nav */
  .logo {
    width: 96px; height: 96px; margin: 0 auto 22px;
    border-radius: 26px; overflow: hidden;
    display: block;
    box-shadow: 0 12px 26px -14px rgba(94, 23, 235, 0.5);
  }
  .logo img { width: 100%; height: 100%; object-fit: cover; display: block; }

  h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; }
  .sub { color: var(--ink-2); font-size: 16px; margin-top: 12px; line-height: 1.6; }

  .btns { margin-top: 28px; display: flex; flex-direction: column; gap: 11px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 16px 26px; border-radius: 40px;
    font-family: var(--font); font-size: 16px; font-weight: 650; line-height: 1;
    text-decoration: none; border: 1.5px solid transparent; cursor: pointer;
    transition: transform 0.18s var(--ease), box-shadow 0.18s var(--ease);
  }
  .btn svg { width: 17px; height: 17px; }
  .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 10px 24px -10px rgba(94, 23, 235, 0.65); }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 16px 30px -12px rgba(94, 23, 235, 0.7); }
  .btn-ghost { background: #fff; color: var(--ink); border-color: var(--line-2); }
  .btn-ghost:hover { border-color: #cfcfcf; transform: translateY(-2px); }

  .status {
    color: var(--good); font-size: 14.5px; font-weight: 600;
    margin-top: 18px; min-height: 21px;
    display: flex; align-items: center; justify-content: center; gap: 7px;
  }
  .status svg { width: 15px; height: 15px; }

  .help { margin-top: 22px; font-size: 14px; color: var(--ink-3); }
  .help a { color: var(--accent); font-weight: 600; }

  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
  }
  @media (max-width: 520px) {
    .card { padding: 36px 24px 30px; }
    h1 { font-size: 27px; }
  }
</style>
</head>
<body>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <div class="card">
    <div class="logo"><img src="images/logo.png" alt="CopyCat" /></div>
    <h1>Thank you!</h1>
    <p class="sub" id="sub">Preparing your download…</p>
    <div class="btns" id="buttons"></div>
    <p class="status" id="status"></p>
    <p class="help">
      Trouble downloading?
      <a href="mailto:barboundlaw@gmail.com?subject=CopyCat%20purchase%20help">Email us</a> — we reply fast.
    </p>
  </div>

<script>
/* ---------------------------------------------------------------
   Confetti — a single short burst, then it settles and stops.
   Kept deliberately restrained: brand colours, ~110 pieces, drifts
   down over a few seconds and fades out rather than looping.
   --------------------------------------------------------------- */
(() => {
  const canvas = document.getElementById("confetti");
  if (!canvas || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  const ctx = canvas.getContext("2d");
  const COLORS = ["#5e17eb", "#7c3aed", "#a78bfa", "#ddd0ff", "#12a150", "#ffffff"];
  const COUNT = 110;
  const DURATION = 4200;   // spawn window
  const FADE = 1400;       // tail-off once pieces reach the bottom

  let dpr, W, H, pieces = [], start = null, raf;

  const resize = () => {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  resize();
  window.addEventListener("resize", resize);

  const rand = (a, b) => a + Math.random() * (b - a);

  for (let i = 0; i < COUNT; i++) {
    pieces.push({
      x: rand(0, W),
      y: rand(-H * 0.6, -10),          // staggered above the fold so they arrive in waves
      w: rand(6, 11),
      h: rand(9, 15),
      color: COLORS[(Math.random() * COLORS.length) | 0],
      vy: rand(38, 92),                 // px per second — slow enough to read as tasteful
      drift: rand(-22, 22),
      spin: rand(-2.2, 2.2),
      rot: rand(0, Math.PI * 2),
      sway: rand(0.6, 1.5),
      phase: rand(0, Math.PI * 2)
    });
  }

  const frame = (t) => {
    if (start === null) start = t;
    const elapsed = t - start;
    const dt = 1 / 60;

    ctx.clearRect(0, 0, W, H);

    // fade the whole layer once the burst is over
    const fadeStart = DURATION;
    const alpha = elapsed < fadeStart ? 1 : Math.max(0, 1 - (elapsed - fadeStart) / FADE);
    ctx.globalAlpha = alpha;

    let visible = 0;
    for (const p of pieces) {
      p.y += p.vy * dt;
      p.x += (p.drift + Math.sin(elapsed / 600 * p.sway + p.phase) * 14) * dt;
      p.rot += p.spin * dt;

      if (p.y < H + 30) visible++;

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }

    if (alpha <= 0 || (visible === 0 && elapsed > 1200)) {
      ctx.clearRect(0, 0, W, H);
      cancelAnimationFrame(raf);
      window.removeEventListener("resize", resize);
      return;
    }
    raf = requestAnimationFrame(frame);
  };
  raf = requestAnimationFrame(frame);
})();

/* ---------------------------------------------------------------
   Download — pulls the latest macOS build straight from GitHub
   Releases and kicks off the Apple Silicon build automatically.
   --------------------------------------------------------------- */
(async () => {
  const sub = document.getElementById("sub");
  const buttons = document.getElementById("buttons");
  const status = document.getElementById("status");

  const DL_ICON =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';

  const btn = (href, label, primary) =>
    `<a class="btn ${primary ? "btn-primary" : "btn-ghost"}" href="${href}">${DL_ICON}${label}</a>`;

  try {
    const rel = await fetch(
      "https://api.github.com/repos/KristiGreenwald/copycat/releases/latest"
    ).then((r) => r.json());
    const assets = rel.assets || [];
    const find = (re) => (assets.find((a) => re.test(a.name)) || {}).browser_download_url;

    const silicon = find(/aarch64\.dmg$/i);
    const intel = find(/x64\.dmg$/i);
    const primary = silicon || intel;

    if (!primary) {
      sub.textContent =
        "Your payment went through, but the build isn't published yet. " +
        "Email us and we'll send it the moment it's live — you'll get every update automatically.";
      buttons.innerHTML = btn(
        "mailto:barboundlaw@gmail.com?subject=CopyCat%20download%20request",
        "Email us for your download",
        true
      );
      return;
    }

    sub.textContent =
      "Your CopyCat for Mac download is starting. Apple Silicon and Intel builds are both yours.";

    const rows = [];
    if (silicon) rows.push(btn(silicon, "Download for Apple Silicon (M1–M4)", true));
    if (intel) rows.push(btn(intel, "Download for Intel Mac", !silicon));
    buttons.innerHTML = rows.join("");

    setTimeout(() => {
      const a = document.createElement("a");
      a.href = primary;
      a.click();
      status.innerHTML =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' +
        "Download started — check your Downloads folder.";
    }, 900);
  } catch (e) {
    sub.textContent = "Couldn't reach the download server automatically.";
    buttons.innerHTML = btn(
      "https://github.com/KristiGreenwald/copycat/releases/latest",
      "Open the downloads page",
      true
    );
  }
})();
</script>
</body>
</html>
